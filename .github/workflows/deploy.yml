# Baut die Erde-App und veröffentlicht sie auf GitHub Pages.
# Läuft bei jedem Push (und von Hand): holt frische Satelliten-Bahndaten (CelesTrak).
# Der stündliche Abruf der Wolken- und Echtfarbenbilder ist abgeschaltet (das Archiv wird nicht mehr gefüllt);
# die App lädt die Bilder dann direkt bei EUMETSAT/NOAA. Das Skript scripts/fetch_imagery.py bleibt vorhanden.
#
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions“.
name: Erde bauen & veröffentlichen

on:
  push:
    branches: [main, ccr-beed262d-leye1s]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Satelliten-Bahndaten aktualisieren (nur bei Push oder von Hand, CelesTrak bittet um sparsame Abfragen)
        run: npm run fetch:sats
        continue-on-error: true # sonst bleibt der mitgelieferte Stand

      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
