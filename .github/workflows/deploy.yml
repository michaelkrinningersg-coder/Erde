# Baut die Erde-App und veröffentlicht sie auf GitHub Pages.
# Läuft bei jedem Push (und von Hand) und holt keine Daten mehr.
# Abgeschaltet: Abruf der Wolken- und Echtfarbenbilder (die App lädt sie direkt bei EUMETSAT/NOAA) und der
# Satelliten-Bahndaten (die App nutzt den mitgelieferten Stand in public/data/satellites.json).
# Die Skripte scripts/fetch_imagery.py und scripts/fetch-satellites.mjs (npm run fetch:sats) bleiben vorhanden.
#
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions“.
name: Erde bauen & veröffentlichen

on:
  push:
    branches: [main, ccr-beed262d-leye1s]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
